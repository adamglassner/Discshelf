<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Discshelf mobile album</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F0A93B}a:hover{color:#FFC768}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #141210; color: #F2EDE4; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 52px 12px 0; display: flex; justify-content: space-between">
    <a href="MobileLibrary.dc.html" aria-label="Back to library" style="width: 44px; height: 44px; display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F2EDE4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <button type="button" aria-label="More options" style="width: 44px; height: 44px; border: 0; background: transparent; display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="#F2EDE4" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg></button>
  </div>
  <div style="padding: 8px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <div style="align-self: center; width: 220px; height: 220px; border-radius: 10px; background: #283353; position: relative; overflow: hidden">
      <div style="position: absolute; width: 70%; aspect-ratio: 1 / 1; border-radius: 50%; border: 16px solid #F0A93B; box-sizing: border-box; right: -12%; bottom: -12%"></div>
    </div>
    <div>
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.02em">Night Bus Hymns</h1>
      <div style="font-size: 14px; color: #D6CFC4; margin-top: 4px">The Quiet Arcade</div>
      <div style="font-size: 12px; color: #A89F92; margin-top: 4px; font-family: 'IBM Plex Mono', monospace">2025 · 10 tracks · 41 min · FLAC</div>
    </div>
    <div style="display: flex; gap: 10px; align-items: center">
      <button type="button" style="flex: 1; height: 48px; border-radius: 24px; border: 0; background: #F0A93B; color: #1A1408; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="#1A1408" aria-hidden="true"><path d="M6 4l14 8-14 8z"></path></svg>Play</button>
      <button type="button" style="flex: 1; height: 48px; border-radius: 24px; border: 1px solid #2E2A25; background: transparent; font-weight: 500">Shuffle</button>
      <button type="button" aria-label="Download for offline" style="width: 48px; height: 48px; border-radius: 50%; border: 1px solid #2E2A25; background: transparent; display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F2EDE4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M6 11l6 6 6-6M5 21h14"></path></svg></button>
    </div>
  </div>
  <div style="flex: 1; overflow: hidden; padding: 12px 20px 0">
    <sc-for list="{{tracks}}" as="t" hint-placeholder-count="6">
      <div style="{{t.rowStyle}}">
        <span style="width: 22px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #A89F92">{{t.n}}</span>
        <div style="flex: 1; min-width: 0">
          <div style="{{t.titleStyle}}">{{t.title}}</div>
        </div>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #A89F92">{{t.time}}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const T = [
      ['Streetlamp Choir','3:47'],['Last Stop, Maple Ave','4:31'],['Window Seat','4:10'],
      ['Transfer at Midnight','3:22'],['Fogged Glass','5:02'],['Driver’s Radio','3:55'],['Terminus','4:48']
    ];
    const tracks = T.map(([title, time], i) => {
      const on = i === 1;
      return {
        n: i + 1, title, time,
        rowStyle: 'display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid #221E1A',
        titleStyle: `font-size: 15px; font-weight: ${on ? 600 : 400}; color: ${on ? '#F0A93B' : '#F2EDE4'}`
      };
    });
    return { tracks };
  }
}
</script>
</body>
</html>
