<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Discshelf mobile library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F0A93B}a:hover{color:#FFC768}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #141210; color: #F2EDE4; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="padding: 56px 20px 12px; display: flex; align-items: center; justify-content: space-between">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 32px; font-weight: 700; letter-spacing: -0.02em">Library</h1>
    <button type="button" aria-label="Sort and filter" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #2E2A25; background: transparent; display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F2EDE4" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg></button>
  </div>
  <div style="display: flex; gap: 8px; padding: 4px 20px 16px; overflow-x: auto">
    <button type="button" style="flex: 0 0 auto; height: 36px; padding: 0 14px; border-radius: 18px; border: 0; background: #F0A93B; color: #1A1408; font-weight: 600; font-size: 14px">Albums</button>
    <button type="button" style="flex: 0 0 auto; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #2E2A25; background: transparent; font-size: 14px">Artists</button>
    <button type="button" style="flex: 0 0 auto; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #2E2A25; background: transparent; font-size: 14px">Songs</button>
    <button type="button" style="flex: 0 0 auto; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #2E2A25; background: transparent; font-size: 14px">Playlists</button>
    <button type="button" style="flex: 0 0 auto; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #2E2A25; background: transparent; font-size: 14px">Downloaded</button>
  </div>
  <div style="flex: 1; overflow: hidden; padding: 0 20px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 16px">
      <sc-for list="{{albums}}" as="al" hint-placeholder-count="6">
        <a href="MobileAlbum.dc.html" style="display: flex; flex-direction: column; gap: 8px; color: #F2EDE4; text-decoration: none">
          <div style="{{al.artStyle}}"><div style="{{al.discStyle}}"></div></div>
          <div>
            <div style="font-weight: 600; font-size: 14px">{{al.title}}</div>
            <div style="font-size: 13px; color: #A89F92">{{al.artist}}</div>
          </div>
        </a>
      </sc-for>
    </div>
  </div>

  <a href="MobileNowPlaying.dc.html" style="position: absolute; left: 10px; right: 10px; bottom: 92px; height: 60px; box-sizing: border-box; padding: 8px; border-radius: 12px; background: #2A251F; display: flex; align-items: center; gap: 12px; color: #F2EDE4; text-decoration: none; box-shadow: 0 8px 24px rgba(0,0,0,0.5)">
    <div style="width: 44px; height: 44px; border-radius: 6px; background: #283353; flex: 0 0 auto"></div>
    <div style="flex: 1; min-width: 0">
      <div style="font-size: 14px; font-weight: 600">Last Stop, Maple Ave</div>
      <div style="font-size: 12px; color: #A89F92">The Quiet Arcade</div>
    </div>
    <span style="width: 44px; height: 44px; display: grid; place-items: center" aria-label="Pause"><svg width="20" height="20" viewBox="0 0 24 24" fill="#F2EDE4" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"></path></svg></span>
    <div style="position: absolute; left: 12px; right: 12px; bottom: 2px; height: 2px; background: #3A342D"><div style="width: 38%; height: 100%; background: #F0A93B"></div></div>
  </a>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 8px 12px 24px; background: #0F0D0B; border-top: 1px solid #2E2A25; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: #A89F92; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9h-6v-6H9v6H3z"></path></svg>Home</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: #A89F92; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>Search</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: #F0A93B; text-decoration: none; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="7"></circle><circle cx="10" cy="10" r="2"></circle><path d="M20 4v17M3 21h18"></path></svg>Library</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: #A89F92; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>Settings</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const A = [
      ['Night Bus Hymns','The Quiet Arcade','#283353','#F0A93B'],
      ['Low Tide Radio','Marrow & Pine','#2F5D62','#E8D9B5'],
      ['Copper Hours','Ada Feld','#B5562C','#F3E3C3'],
      ['Field Notes','June Okafor','#6B7A3A','#EFE8D2'],
      ['Glasshouse','Teo Lindqvist','#8E3B5A','#F6D7E0'],
      ['Paper Moons','The Halverns','#D9B44A','#2A2620']
    ];
    const albums = A.map(([title, artist, bg, ring], i) => ({
      title, artist,
      artStyle: `aspect-ratio: 1 / 1; border-radius: 8px; background: ${bg}; position: relative; overflow: hidden`,
      discStyle: `position: absolute; width: 64%; aspect-ratio: 1 / 1; border-radius: 50%; border: 10px solid ${ring}; box-sizing: border-box; ${i % 2 ? 'left: -14%; top: 18%' : 'right: -12%; bottom: -12%'}`
    }));
    return { albums };
  }
}
</script>
</body>
</html>
